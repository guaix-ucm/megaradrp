name: Build and publish the container image

# Called by the release workflow after the upload to PyPI, or run by hand
# to build the image of a version already in PyPI
on:
  workflow_call:
    inputs:
      version:
        description: Version of megaradrp in PyPI, with or without a leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version of megaradrp in PyPI, for example 0.30
        required: true
        type: string
      push:
        description: Publish the image (if false, only build it)
        type: boolean
        default: false
      latest:
        description: Tag the image also as latest
        type: boolean
        default: true

# Only read access for the GITHUB_TOKEN, the jobs that need more ask for it
permissions:
  contents: read

jobs:
  container:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # inputs.push and inputs.latest are empty in workflow_call
      PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
      LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.latest }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Version of megaradrp
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # The image installs the wheel uploaded to PyPI. Just after the
      # upload, it can take a few minutes to be available
      - name: Download the wheel from PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if python3 -m pip download --no-deps --no-cache-dir --only-binary :all: \
                --dest dist "megaradrp==${VERSION}"; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Robot account of quay.io with write permission in the
      # repository guaix-ucm/megaradrp
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/guaix-ucm/megaradrp
            quay.io/guaix-ucm/megaradrp
          tags: |
            type=pep440,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ env.LATEST }}
          labels: |
            org.opencontainers.image.title=megaradrp
            org.opencontainers.image.description=Container with megaradrp, the data reduction pipeline of MEGARA

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
