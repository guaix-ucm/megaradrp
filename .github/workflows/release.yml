name: Create wheel and upload to PyPI

# Build when a release is published
on:
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install build
        run: |
          python -m pip install build

      - name: Build sdist
        # This builds both the wheel and sdist
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          path: dist/megaradrp*

  upload_pypi:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    # upload to PyPI on every tag starting with 'v'
    #if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: artifact
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    name: Build and publish the container image
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The image installs the same wheel that was uploaded to PyPI
      - uses: actions/download-artifact@v8.0.2
        with:
          name: artifact
          path: dist

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Robot account of quay.io with write permission in the
      # repository guaix-ucm/megaradrp
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/guaix-ucm/megaradrp
            quay.io/guaix-ucm/megaradrp
          tags: |
            type=pep440,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=megaradrp
            org.opencontainers.image.description=Container with megaradrp, the data reduction pipeline of MEGARA

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
